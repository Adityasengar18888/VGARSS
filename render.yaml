# ==============================================================================
# VGARSS 2.0 — Render Blueprint Specification (Infrastructure as Code)
# ------------------------------------------------------------------------------
# Deploys:
# 1. vgarss-api: FastAPI backend with Uvicorn, WebSockets (/ws/v2), and Authoritative Scheduler
# 2. vgarss-web: Vite React static site with SPA routing rewrites
# 3. vgarss-db:  Managed PostgreSQL 16 relational database
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI ASGI Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: vgarss-api
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt && python scripts/migrate_db.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v2/health
    autoDeploy: true
    envVars:
      - key: VGARSS_ENV
        value: production
      - key: VGARSS_LOG_LEVEL
        value: INFO
      - key: VGARSS_SCHEDULER_WORKER
        value: "true"
      - key: VGARSS_SCHEDULER_INTERVAL
        value: "1.0"
      - key: VGARSS_SCHEDULER_LOCK_TTL
        value: "5.0"
      - key: VGARSS_ENABLE_TCP
        value: "false"
      - key: VGARSS_TRUST_PROXY_HEADERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vgarss-db
          property: connectionString
      - key: VGARSS_CORS_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React + TypeScript Static Web Host
  # ----------------------------------------------------------------------------
  - type: web
    name: vgarss-web
    runtime: static
    region: oregon
    plan: free
    branch: master
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vgarss-api
          property: host

databases:
  # ----------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: vgarss-db
    region: oregon
    plan: free
    databaseName: vgarss
    user: vgarss_admin

