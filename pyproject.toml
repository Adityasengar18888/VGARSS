[project]
name = "vgarss-backend"
version = "0.1.0"
description = "VGARSS Backend - Virtual Group Asynchronous Real-Time Resource Synchronization & Scheduling System"
authors = [{ name = "VGARSS Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/backend"]
pythonpath = ["."]
